<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedVisit - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #e8f5e9, #f0f7f4, #e0f2f1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(74, 145, 101, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            margin: 20px;
        }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo img { width: 160px; height: auto; }
        h1 { color: #4a9165; font-size: 1.6em; text-align: center; margin-bottom: 8px; }
        .subtitle { color: #888; text-align: center; margin-bottom: 28px; font-size: 0.95em; }
        .form-group { margin-bottom: 18px; position: relative; }
        .form-group i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #aaa; font-size: 1em;
        }
        .form-group input {
            width: 100%; padding: 12px 14px 12px 42px;
            border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 1em; outline: none; transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: #88c9a1; }
        .login-btn {
            width: 100%; padding: 13px; background: linear-gradient(135deg, #88c9a1, #4a9165);
            color: white; border: none; border-radius: 10px;
            font-size: 1.1em; cursor: pointer; transition: all 0.3s; font-weight: 600;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(74, 145, 101, 0.4); }
        .error-msg {
            background: #ffeaea; color: #d32f2f; padding: 10px 14px;
            border-radius: 8px; margin-bottom: 16px; font-size: 0.9em;
            display: none; text-align: center;
        }
        .error-msg.visible { display: block; }
        .back-link {
            display: block; text-align: center; margin-top: 20px;
            color: #4a9165; text-decoration: none; font-size: 0.95em;
        }
        .back-link:hover { text-decoration: underline; }
        .demo-credentials {
            margin-top: 24px; padding: 16px; background: #f5faf7;
            border-radius: 10px; font-size: 0.85em; color: #666;
        }
        .demo-credentials h4 { color: #4a9165; margin-bottom: 8px; font-size: 0.95em; }
        .demo-credentials p { margin-bottom: 4px; }
        .demo-credentials code {
            background: #e8f5e9; padding: 2px 6px; border-radius: 4px;
            font-family: monospace; color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="login-container animate__animated animate__fadeIn">
        <div class="logo">
            <img src="img/Med Vizit (1).png" alt="MedVisit Logo">
        </div>
        <h1><i class="fas fa-sign-in-alt"></i> Login</h1>
        <p class="subtitle">Sign in to your account</p>

        <div class="error-msg" id="error-msg">
            <i class="fas fa-exclamation-circle"></i> Incorrect username or password
        </div>

        <form action="/login" method="POST" id="login-form">
            <div class="form-group">
                <i class="fas fa-user"></i>
                <input type="text" name="username" id="username" placeholder="Username" required autocomplete="username">
            </div>
            <div class="form-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" id="password" placeholder="Password" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn">
                <i class="fas fa-arrow-right"></i> Sign In
            </button>
        </form>

        <a href="/index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>

        <div class="demo-credentials">
            <h4><i class="fas fa-info-circle"></i> Demo Accounts</h4>
            <p><strong>Admin:</strong> <code>admin</code> / <code>123456</code></p>
            <p><strong>Doctor:</strong> <code>doctor1</code> / <code>123456</code></p>
            <p><strong>Patient:</strong> <code>patient1</code> / <code>123456</code></p>
        </div>
    </div>

    <script>
        // Show error if redirected with error param
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'true') {
            document.getElementById('error-msg').classList.add('visible');
        }
    </script>
</body>
</html>
